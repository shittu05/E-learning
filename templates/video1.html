{% load static %} 
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Video 1</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'assets/css/styles.css' %}" />
  <style>
    .video-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    /* Loading spinner overlay */
    .video-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      z-index: 10;
      color: #fff;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .video-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Buffering bar at bottom of video */
    .buffer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #0d6efd;
      z-index: 11;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body data-page="video1">
  <header class="app-header d-flex align-items-center justify-content-between">
    <div class="app-logo">Technology and Assessment</div>
  </header>

  <main class="main-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card card-shadow p-4 p-md-5">
            <h2 class="h4 mb-3">Video 1 — Assessment Basics</h2>

            <div class="video-container mb-3">
              <!-- Loading overlay -->
              <div class="video-loader" id="videoLoader">
                <div class="spinner"></div>
                <small>Loading video…</small>
              </div>

              <!-- Buffer progress bar -->
              <div class="buffer-bar" id="bufferBar"></div>

              <!--
                KEY OPTIMISATIONS:
                1. preload="metadata"  → only loads first frame + duration, not entire file
                2. poster             → shows a thumbnail so the player doesn't look blank
                3. playsinline        → prevents iOS fullscreen hijack
                Remove the poster attribute if you don't have a thumbnail image yet
              -->
              <video
                id="mainVideo"
                controls
                class="w-100"
                preload="metadata"
                playsinline
                poster="{{ MEDIA_URL }}videos/video11_thumb.jpg"
                aria-label="Video 1"
                data-video-name="video1"
              >
                <!--
                  BEST PRACTICE: serve WebM first (smaller), MP4 as fallback.
                  If you only have MP4 right now that's fine — just keep the one source.
                  To create WebM: ffmpeg -i video11.mp4 -c:v libvpx-vp9 -crf 30 -b:v 0 video11.webm
                -->
                <source src="{{ MEDIA_URL }}videos/video11.webm" type="video/webm" />
                <source src="{% static 'assets/videos/Video1.mp4' %}" type="video/mp4" />
                Your browser does not support the video element.
              </video>
            </div>

            <p class="text-muted">
              This short video explains the main idea behind the basics of conducting assessment.
            </p>

            <div class="d-flex justify-content-between mt-3">
              <a class="btn btn-outline-secondary" href="{% url 'learning' %}">Back to Learning Hub</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'assets/js/app.js' %}" defer></script>
  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(cookie => {
          cookie = cookie.trim();
          if (cookie.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          }
        });
      }
      return cookieValue;
    }

    document.addEventListener('DOMContentLoaded', function () {
      const video     = document.getElementById('mainVideo');
      const loader    = document.getElementById('videoLoader');
      const bufferBar = document.getElementById('bufferBar');

      // ── Hide loader once enough data is ready to play ──
      video.addEventListener('canplay', () => loader.classList.add('hidden'));

      // Show loader again if connection stalls
      video.addEventListener('waiting', () => loader.classList.remove('hidden'));
      video.addEventListener('playing', () => loader.classList.add('hidden'));

      // ── Buffer progress bar ──
      video.addEventListener('progress', () => {
        if (video.buffered.length > 0 && video.duration) {
          const pct = (video.buffered.end(video.buffered.length - 1) / video.duration) * 100;
          bufferBar.style.width = pct + '%';
        }
      });

      // ── Video event tracking (unchanged) ──
      function logVideoEvent(eventType) {
        const payload = {
          video_id:     video.currentSrc || 'unknown',
          event_type:   eventType,
          timestamp:    new Date().toISOString(),
          course_id:    '1',
          course_title: 'Problem to Solve One'
        };

        fetch('/learn/track_video_event/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
          },
          body: JSON.stringify(payload)
        })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => console.log('Video event tracked:', data))
        .catch(err => console.error('Tracking error:', err));
      }

      // Track video start time
      let videoStartTime = 0;
      let totalWatchDuration = 0;

      video.addEventListener('play', () => {
        videoStartTime = new Date().getTime();
        logVideoEvent('play');
      });

      video.addEventListener('pause', () => {
        if (videoStartTime > 0) {
          const watchedSeconds = Math.round((new Date().getTime() - videoStartTime) / 1000);
          totalWatchDuration += watchedSeconds;
          // Send duration with pause event
          const payload = {
            video_id:       video.currentSrc || 'unknown',
            event_type:     'pause',
            timestamp:      new Date().toISOString(),
            course_id:      '1',
            course_title:   'Problem to Solve One',
            watch_duration: totalWatchDuration
          };
          fetch('/learn/track_video_event/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
          })
          .then(r => r.ok ? r.json() : Promise.reject(r.status))
          .then(data => console.log('Video duration tracked:', data))
          .catch(err => console.error('Tracking error:', err));
        }
      });

      video.addEventListener('ended', () => {
        if (videoStartTime > 0) {
          const watchedSeconds = Math.round((new Date().getTime() - videoStartTime) / 1000);
          totalWatchDuration += watchedSeconds;
          // Send duration with ended event
          const payload = {
            video_id:       video.currentSrc || 'unknown',
            event_type:     'ended',
            timestamp:      new Date().toISOString(),
            course_id:      '1',
            course_title:   'Problem to Solve One',
            watch_duration: totalWatchDuration
          };
          fetch('/learn/track_video_event/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
          })
          .then(r => r.ok ? r.json() : Promise.reject(r.status))
          .then(data => console.log('Video duration tracked:', data))
          .catch(err => console.error('Tracking error:', err));
        }
      });
    });
  </script>
</body>
</html>
